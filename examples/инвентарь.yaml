# Пример инвентаря Пульта: выдуманная инфраструктура на 17 узлов.
# Схема — docs/контракт.md, раздел 1. В режиме разработки приложение берёт этот каталог,
# пока в настройках не задан другой. Все имена и адреса выдуманные.
#
# Что здесь есть: все виды узлов (внешнее, хост, вм, контейнер, сервис, туннель),
# проверки tcp, http и ollama, в том числе изнутри закрытой сети (`откуда`), сбор с ключом и
# вложенный сбор (`через`), контейнеры по имени и по меткам compose, ВМ гипервизора,
# `ожидается: остановлен` и `любое`, узел без проверок, папки проектов (`проект`) и
# скрытый узел (`скрыть: true`).

версия_схемы: 1
узлы:
  - id: интернет
    название: Интернет
    вид: внешнее
    проверки:
      - {вид: tcp, адрес: "1.1.1.1:443"}
      - {вид: tcp, адрес: "example.com:443"}

  - id: репозитории
    название: Хостинг репозиториев
    вид: внешнее
    зависит_от: [интернет]
    проверки:
      - {вид: http, url: "https://example.com/", ожидать: [200, 301]}

  - id: хост-а
    название: Хост А
    вид: хост
    группа: прод
    зависит_от: [интернет]
    проверки:
      - {вид: tcp, адрес: "a.example.com:22"}
    сбор:
      ssh: "deploy@a.example.com"
      ключ: "~/.ssh/id_ed25519"
      что: [docker, wireguard]
    доступ:
      как_зайти: "ssh deploy@a.example.com"
      секрет: "хранилище → SSH-ключ хоста А"
      у_кого: [alice, bob]

  - id: прокси
    название: Обратный прокси
    вид: контейнер
    группа: прод
    на: хост-а
    контейнер: edge-proxy
    проверки:
      - {вид: http, url: "https://proxy.example.com/ping"}

  - id: база
    название: База данных
    вид: контейнер
    группа: прод
    на: хост-а
    проект: Приложение
    compose: {проект: app, сервис: db}
    доступ:
      как_зайти: "docker compose -p app exec db psql"
      секрет: "хранилище → пароль базы"
      у_кого: [alice]

  - id: api
    название: API
    вид: контейнер
    группа: прод
    на: хост-а
    проект: Приложение
    зависит_от: [прокси, база]
    compose: {проект: app, сервис: backend}
    проверки:
      - {вид: http, url: "https://api.example.com/health", ожидать: [200, 204], таймаут_мс: 4000}
    ссылки:
      - {название: Метрики, url: "https://metrics.example.com/d/api"}

  - id: мигратор
    название: Миграции базы
    вид: контейнер
    группа: прод
    на: хост-а
    проект: Приложение
    зависит_от: [база]
    контейнер: app-migrate
    ожидается: остановлен

  # Проверяется, но на карте не нужна: её «работает» никому ничего не говорит.
  - id: заглушка
    название: Заглушка «сайт обновляется»
    вид: контейнер
    группа: прод
    на: хост-а
    контейнер: app-maintenance
    скрыть: true

  - id: сайт
    название: Сайт
    вид: сервис
    группа: прод
    зависит_от: [прокси]
    проверки:
      - {вид: http, url: "https://site.example.com/", таймаут_мс: 3000}
    ссылки:
      - {название: Открыть сайт, url: "https://site.example.com"}

  - id: туннель-дом
    название: WireGuard до дома
    вид: туннель
    группа: дом
    зависит_от: [хост-а]
    проверки:
      - {вид: tcp, адрес: "10.0.0.2:22", откуда: хост-а}

  - id: гипервизор
    название: Гипервизор
    вид: хост
    группа: дом
    зависит_от: [туннель-дом]
    проверки:
      - {вид: http, url: "https://10.0.0.3:8006/", откуда: хост-а}
    сбор:
      ssh: "root@10.0.0.3"
      через: хост-а
      ключ: "/home/deploy/.ssh/id_home"   # ключ лежит на хосте А, а не у пользователя
      что: [proxmox]

  - id: вм-сборки
    название: ВМ для сборок
    вид: вм
    группа: дом
    на: гипервизор
    вм: 101
    ожидается: любое                       # включают по необходимости

  - id: хост-б
    название: Хост Б (за туннелем)
    вид: вм
    группа: дом
    на: гипервизор
    вм: 100
    сбор:
      ssh: "user@10.0.0.4"
      через: хост-а
      что: [docker]

  - id: панель
    название: Панель задач
    вид: контейнер
    группа: дом
    на: хост-б
    проект: Задачи
    контейнер: tasks-panel
    проверки:
      - {вид: http, url: "https://tasks.example.com/health"}
    доступ:
      как_зайти: "https://tasks.example.com"
      секрет: "хранилище → токен панели"
      у_кого: [alice, bob]
    ссылки:
      - {название: Логи, url: "https://logs.example.com"}

  - id: заметки
    название: База заметок
    вид: контейнер
    группа: дом
    на: хост-б
    проект: Заметки
    контейнер: notes-db
    проверки:
      - {вид: tcp, адрес: "10.0.0.4:5984", откуда: хост-а}

  - id: копии
    название: Резервные копии
    вид: сервис
    группа: дом
    зависит_от: [хост-б]

  # Сервер Ollama в закрытой сети: спрашиваются список моделей и что в памяти, генерации нет.
  - id: модели
    название: Локальные модели
    вид: сервис
    группа: дом
    проект: ИИ
    зависит_от: [хост-б]
    проверки:
      - {вид: ollama, url: "http://10.0.0.4:11434", откуда: хост-а, ожидать_модели: [qwen3]}
