[package]
name = "pult"
# Версия приложения живёт в package.json; эта — только версия крейта, её не трогаем.
version = "0.0.0"
description = "Пульт — карта хостов и сервисов RaspizDIYs"
authors = ["RaspizDIYs"]
edition = "2021"

[lib]
# Имя с _lib, чтобы не столкнуться с бинарником pult в Windows (см. шаблон Tauri).
name = "pult_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Нужен макросу generate_context! для конфигов плагинов.
serde_json = "1"
# Закреплено точно: поведение установки обновлений меняется между версиями плагина.
tauri-plugin-updater = "=2.13.1"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
# Плагины закреплены точно, как updater: поведение меняется между версиями.
tauri-plugin-notification = "=2.5.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-dialog = "=2.8.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# Незнакомые поля инвентаря — предупреждение, а не ошибка: serde их молча пропускает.
serde_ignored = "0.1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
log = "0.4"
# macros — для tokio::select! и #[tokio::test] в модуле сбора.
tokio = { version = "1", features = ["net", "time", "process", "sync", "rt", "io-util", "macros"] }
# Те же reqwest и rustls, что уже тянет updater: новых крейтов для http-проверок не нужно.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[profile.release]
strip = true
