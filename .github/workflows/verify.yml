name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Мак, а не Linux: целевые ОС — мак и винда, и не нужно ставить webkit2gtk.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      # tsc + vite build; dist нужен и для cargo — generate_context! встраивает его в бинарник.
      - run: npm run build
      - run: cargo check --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
